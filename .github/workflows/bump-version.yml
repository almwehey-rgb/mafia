name: Bump app version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(version):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Increase patch version by 0.01
        id: version
        shell: bash
        run: |
          current="$(node -p "require('./version.json').version")"
          next="$(node -e "const value = Number(process.argv[1]); if (!Number.isFinite(value)) process.exit(1); console.log((Math.round((value + 0.01) * 100) / 100).toFixed(2));" "$current")"
          node -e "const fs = require('fs'); fs.writeFileSync('version.json', JSON.stringify({ version: process.argv[1] }, null, 2) + '\n');" "$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(version): v${{ steps.version.outputs.version }}"
          git push
