<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>معاينة — وضع الأطفال</title>
  <link rel="stylesheet" href="/app-v64.css?v=e14ux5">
</head>
<body class="screen-lobby">
  <main class="shell">
    <header class="header">
      <div class="brand"><div class="logo">مافيا<small>MAFIA</small></div></div>
      <div class="room-tag">1234 · 🧒</div>
    </header>
    <div id="app">
      <div class="card setup-card" data-step="2">
        <div class="setup-tabs">
          <button>1 الإعداد</button>
          <button class="on">2 الأدوار</button>
          <button>3 المراجعة</button>
        </div>
        <h3 class="role-picker-title">شخصيات وضع الأطفال فقط — اضغط البطاقة لتفعيلها أو إلغائها</h3>
        <div class="role-preview">
          <button type="button" class="role-toggle illustrated-role active locked" disabled aria-label="قائد الفريق الغامض">
            <img src="https://mafia-night-iota.vercel.app/assets/role-cards-kids/mafia_boss.webp" alt="قائد الفريق الغامض" width="512" height="768" loading="lazy">
            <span class="selection-mark">◆</span><span class="selection-count">× 1</span>
            <span class="selection-caption"><strong>قائد الفريق الغامض</strong><small>أساسي</small></span>
          </button>
          <button type="button" class="role-toggle illustrated-role active locked" disabled>
            <img src="https://mafia-night-iota.vercel.app/assets/role-cards-kids/mafia.webp" alt="الفريق الغامض" width="512" height="768" loading="lazy">
            <span class="selection-mark">◆</span><span class="selection-count">× 1</span>
            <span class="selection-caption"><strong>الفريق الغامض</strong><small>أساسي</small></span>
          </button>
          <button type="button" class="role-toggle illustrated-role active">
            <img src="https://mafia-night-iota.vercel.app/assets/role-cards-kids/doctor.webp" alt="الحارس" width="512" height="768" loading="lazy">
            <span class="selection-mark">✓</span><span class="selection-count">× 1</span>
            <span class="selection-caption"><strong>الحارس</strong><small>مفعّل</small></span>
          </button>
          <button type="button" class="role-toggle illustrated-role active">
            <img src="https://mafia-night-iota.vercel.app/assets/role-cards-kids/detective.webp" alt="المحقق" width="512" height="768" loading="lazy">
            <span class="selection-mark">✓</span><span class="selection-count">× 1</span>
            <span class="selection-caption"><strong>المحقق</strong><small>مفعّل</small></span>
          </button>
          <button type="button" class="role-toggle illustrated-role active locked" disabled>
            <img src="https://mafia-night-iota.vercel.app/assets/role-cards-kids/citizen.webp" alt="الأصدقاء" width="512" height="768" loading="lazy">
            <span class="selection-mark">◆</span><span class="selection-count">× 4</span>
            <span class="selection-caption"><strong>الأصدقاء</strong><small>أساسي</small></span>
          </button>
        </div>
        <div class="status">🧒 لعب بسيط: الفريق الغامض، الحارس، المحقق والأصدقاء فقط.</div>
      </div>
    </div>
  </main>
  <p style="text-align:center;color:#888;font-size:14px;margin:0 0 24px">معاينة محلية — وضع الأطفال (5 شخصيات فقط)</p>
</body>
</html>
