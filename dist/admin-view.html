<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>أدمن مافيا</title><style>*{box-sizing:border-box}body{margin:0;padding:clamp(8px,3vw,24px);background:#0d1018;color:#f5f5f7;font:clamp(15px,2.8vw,18px)/1.5 system-ui,sans-serif}header{position:sticky;top:0;background:rgba(13,16,24,.97);padding:12px 0;z-index:1;border-bottom:1px solid #343948}header h2{margin:0 0 6px;font-size:clamp(20px,5vw,30px)}header p{margin:4px 0 10px;color:#b9c0d0}header button{margin:4px}.card{min-width:0;padding:clamp(12px,3vw,18px);margin:10px 0;border:1px solid #343948;border-radius:16px;background:#171b26;overflow-wrap:anywhere}h3{margin:0 0 10px}button,summary{font:inherit;padding:11px 14px;cursor:pointer;touch-action:manipulation}button{background:#30364a;color:white;border:0;border-radius:12px;min-height:44px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}details{margin:10px 0;border:1px solid #343948;border-radius:14px;background:#171b26;padding:4px 12px}summary{font-weight:700;list-style-position:inside}#messages,#history{max-height:42vh;overflow:auto;-webkit-overflow-scrolling:touch}p{overflow-wrap:anywhere}table{display:block;max-width:100%;overflow-x:auto;white-space:nowrap}input,select,textarea{max-width:100%;font:inherit}@media(max-width:560px){body{padding:8px}header{position:relative}header button{display:block;width:100%;margin:7px 0 0}.card{border-radius:12px;padding:12px}#cards{display:block}button,summary{width:100%;text-align:center}details{padding:4px 8px}}</style><script src="/admin-remote.js" defer></script><script src="/admin.js" defer></script><link rel="stylesheet" href="/noir-theme.css"></head><body><header><h2>🛡️ الأدمن — عرض خاص</h2><p id="status">جاري التحقق من الدخول…</p><button id="hide">إخفاء / إظهار الأسرار</button><button id="exit">تسجيل خروج</button></header><main id="private"><p id="roomDetails"></p><div id="cards"></div><details><summary>محادثات المافيا والسجّان</summary><button id="olderMessages" hidden>رسائل أقدم</button><div id="messages"></div></details><details><summary>السجل المحفوظ</summary><button id="historyButton">تحميل آخر ٢٠ حالة</button><div id="history"></div></details></main></body></html>
